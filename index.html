<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        body {
            background-color: #0b0711;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* --- ÉCRAN DE VERROUILLAGE / SCEAU --- */
        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0f2e 0%, #0b0711 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease;
        }

        .welcome-title {
            color: #f3e5ab;
            font-size: 1.5em;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(184, 134, 11, 0.6);
            text-align: center;
        }

        /* Rouleau fermé en lévitation */
        .floating-scroll {
            position: relative;
            width: 140px;
            height: 280px;
            background: linear-gradient(135deg, #2c1d3d 0%, #150b22 100%);
            border: 3px solid #b8860b;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(138, 43, 226, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: float 3s ease-in-out infinite;
            transition: transform 0.2s;
        }

        .floating-scroll:hover {
            transform: scale(1.05);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* Le Sceau / Logo cliquable */
        .seal-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 2px solid #ffd700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
            object-fit: cover;
            transition: box-shadow 0.3s;
        }

        .floating-scroll:hover .seal-logo {
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.9), 0 0 35px rgba(138, 43, 226, 0.8);
        }

        .seal-instruction {
            color: #a89bc9;
            font-size: 0.9em;
            margin-top: 25px;
            letter-spacing: 1px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* --- CONTENU DU PARCHEMIN (Masqué au début) --- */
        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5;
            border: 3px solid #8c7355;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            padding: 30px;
            color: #2a2015;
            opacity: 0;
            transform: scale(0.9);
            transition: all 1s ease;
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            pointer-events: none;
        }

        /* Styles de base du contenu du parchemin */
        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="seal-screen">
        <div class="welcome-title">— Archives de Zenkai NRP —</div>
        <div class="floating-scroll" onclick="breakSeal()" title="Briser le sceau">
            <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
        </div>
        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.8;">
            <p><strong>Accès autorisé.</strong> Le sceau a été rompu avec succès.</p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers secrets de Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            // Effet d'ouverture
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
