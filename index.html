<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        body {
            background-color: #0b0711;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0f2e 0%, #0b0711 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-title {
            color: #f3e5ab;
            font-size: 1.6em;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 35px;
            text-shadow: 0 0 12px rgba(184, 134, 11, 0.7);
            text-align: center;
        }

        .scroll-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: float 3.5s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        /* Corps horizontal du rouleau de type League of Legends */
        .scroll-cylinder {
            position: relative;
            width: 320px;
            height: 110px;
            background: linear-gradient(0deg, #1e0f2e, #2e1b45 45%, #3a2554 50%, #2e1b45 55%, #1e0f2e);
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Embouts en bois/métal à gauche et à droite */
        .scroll-cylinder::before, .scroll-cylinder::after {
            content: '';
            position: absolute;
            top: -6px;
            bottom: -6px;
            width: 20px;
            background: linear-gradient(0deg, #1a0f2e, #4a3263, #1a0f2e);
            border: 2px solid #b8860b;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            z-index: 1;
        }
        .scroll-cylinder::before { left: -10px; }
        .scroll-cylinder::after { right: -10px; }

        /* Cordelette centrale */
        .scroll-rope {
            position: absolute;
            height: 126px;
            width: 16px;
            background: #8c7355;
            border-left: 2px solid #3a2e1d;
            border-right: 2px solid #3a2e1d;
            z-index: 2;
        }

        /* Logo central */
        .seal-logo {
            position: relative;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 50px rgba(138, 43, 226, 0.9);
            object-fit: cover;
            z-index: 3;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .scroll-container:hover .seal-logo {
            transform: scale(1.06);
            box-shadow: 0 0 35px rgba(255, 215, 0, 1), 0 0 70px rgba(138, 43, 226, 1);
        }

        .seal-instruction {
            color: #b8a9d9;
            font-size: 0.85em;
            margin-top: 35px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5;
            border: 3px solid #8c7355;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            padding: 35px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="seal-screen">
        <div class="welcome-title">— Archives de Zenkai NRP —</div>
        
        <div class="scroll-container" onclick="breakSeal()" title="Briser le sceau">
            <div class="scroll-cylinder">
                <div class="scroll-rope"></div>
                <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
            </div>
        </div>

        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.1em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
