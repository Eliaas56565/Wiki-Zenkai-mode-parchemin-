<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            /* Fond de secours uni au cas où l'image ne charge pas */
            background-color: #0b0711;
            overflow: hidden; /* Empêche les barres de défilement */
        }

        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Ton image de fond, étirée pour couvrir tout l'écran */
            background-image: url('fond-rouleau.jpg');
            background-size: cover; /* Recouvre tout l'espace */
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centre verticalement */
            align-items: center; /* Centre horizontalement */
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        /* Conteneur global du rouleau, pour l'animation */
        .scroll-container {
            position: relative;
            cursor: pointer;
            animation: float 3.5s ease-in-out infinite;
            margin-top: -50px; /* Décale le rouleau légèrement vers le haut pour compenser le texte */
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Le logo, positionné au pixel près sur le sceau de l'image de fond */
        .seal-logo {
            position: absolute;
            /* Ces valeurs sont ajustées pour ton image "image_16.png" */
            top: 52.5%; /* Position verticale sur le sceau */
            left: 50%;   /* Position horizontale sur le sceau */
            transform: translate(-50%, -50%);
            width: 22%;  /* Taille du logo par rapport au rouleau */
            height: auto;
            border-radius: 50%;
            object-fit: cover;
            opacity: 0.95;
            transition: transform 0.3s ease, filter 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5), 0 0 30px rgba(138, 43, 226, 0.7);
        }

        .scroll-container:hover .seal-logo {
            transform: translate(-50%, -50%) scale(1.05);
            filter: brightness(1.15);
        }

        .seal-instruction {
            color: #b8a9d9;
            font-size: 0.85em;
            position: absolute;
            bottom: 40px; /* Position en bas de l'écran */
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* --- CONTENU DU PARCHEMIN DÉROULÉ --- */
        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5;
            border: 3px solid #8c7355;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            padding: 35px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DU ROULEAU FERMÉ -->
    <div id="seal-screen">
        <!-- Pas besoin de titre HTML ici car il est dans ton image de fond -->
        
        <div class="scroll-container" onclick="breakSeal()" title="Briser le sceau">
            <!-- Le logo fait office de sceau central, positionné au pixel près -->
            <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
        </div>

        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <!-- CONTENU DU PARCHEMIN DÉROULÉ -->
    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.1em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
