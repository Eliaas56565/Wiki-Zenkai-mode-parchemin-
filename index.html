<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        body {
            background-color: #0b0711;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0b0711;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-title {
            color: #f3e5ab;
            font-size: 1.5em;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(184, 134, 11, 0.7);
            text-align: center;
        }

        /* Conteneur qui intègre ton image de fond du rouleau */
        .scroll-container {
            position: relative;
            width: 650px;
            height: 350px;
            /* On utilise ton image de référence directement comme visuel du rouleau */
            background-image: url('fond-rouleau.jpg');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        /* Ton logo positionné au millimètre au centre exact du sceau de l'image */
        .seal-logo {
            width: 155px;
            height: 155px;
            border-radius: 50%;
            object-fit: cover;
            transition: transform 0.3s ease, filter 0.3s ease;
        }

        .scroll-container:hover .seal-logo {
            transform: scale(1.04);
            filter: brightness(1.15);
        }

        .seal-instruction {
            color: #b8a9d9;
            font-size: 0.85em;
            margin-top: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* --- CONTENU DU PARCHEMIN DÉROULÉ --- */
        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5;
            border: 3px solid #8c7355;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            padding: 35px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="seal-screen">
        <div class="welcome-title">— Archives de Zenkai NRP —</div>
        
        <div class="scroll-container" onclick="breakSeal()" title="Briser le sceau">
            <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
        </div>

        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.1em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
