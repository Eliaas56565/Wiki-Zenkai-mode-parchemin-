<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        /* --- FOND --- */
        body {
            background-color: #0b0711;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* --- ÉCRAN DU ROULEAU CYLINDRIQUE --- */
        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #1a0f2e 0%, #0b0711 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-title {
            color: #f3e5ab;
            font-size: 1.6em;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 35px;
            text-shadow: 0 0 12px rgba(184, 134, 11, 0.7);
            text-align: center;
        }

        /* --- CORPS DU CYLINDRE (Texture et Relief) --- */
        .scroll-cylinder {
            position: relative;
            width: 110px;
            height: 290px;
            /* Un dégradé plus profond pour un effet 3D réaliste */
            background: linear-gradient(90deg, #1e0f2e, #2e1b45 45%, #3a2554 50%, #2e1b45 55%, #1e0f2e);
            border-radius: 12px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.9), inset 0 0 15px rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: float 3.5s ease-in-out infinite;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Effet d'animation de lévitation */
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(1deg); }
        }

        .scroll-cylinder:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 55px rgba(0,0,0,1);
        }

        /* Embouts supérieurs et inférieurs (Couvercles du rouleau) */
        .scroll-cylinder::before, .scroll-cylinder::after {
            content: '';
            position: absolute;
            left: -6px;
            right: -6px;
            height: 16px;
            background: linear-gradient(90deg, #1a0f2e, #4a3263, #1a0f2e);
            border: 2px solid #b8860b; /* Bordure dorée */
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.6);
            z-index: -1;
        }
        .scroll-cylinder::before { top: -8px; }
        .scroll-cylinder::after { bottom: -8px; }

        /* --- CORDELETTE ET SCEAU --- */
        .scroll-rope {
            position: absolute;
            width: 120px;
            height: 14px;
            background: #8c7355; /* Couleur de la corde */
            border-top: 2px solid #3a2e1d;
            border-bottom: 2px solid #3a2e1d;
            z-index: 2;
        }

        .seal-logo {
            position: relative;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px solid #ffd700; /* Anneau doré du sceau */
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.7), 0 0 40px rgba(138, 43, 226, 0.9);
            object-fit: cover; /* Assure que l'image remplit bien le cercle */
            z-index: 3;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .scroll-cylinder:hover .seal-logo {
            transform: scale(1.07);
            box-shadow: 0 0 30px rgba(255, 215, 0, 1), 0 0 60px rgba(138, 43, 226, 1);
        }

        .seal-instruction {
            color: #b8a9d9;
            font-size: 0.85em;
            margin-top: 30px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* --- CONTENU DU PARCHEMIN (Ouverture) --- */
        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5; /* Couleur parchemin vieilli */
            border: 3px solid #8c7355;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            padding: 35px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        /* Styles du contenu */
        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DU ROULEAU FERMÉ -->
    <div id="seal-screen">
        <div class="welcome-title">— Archives de Zenkai NRP —</div>
        
        <div class="scroll-cylinder" onclick="breakSeal()" title="Briser le sceau">
            <div class="scroll-rope"></div>
            <!-- Remplace "logo.jpg" par le nom exact de ton fichier image sur GitHub -->
            <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
        </div>

        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <!-- CONTENU DU PARCHEMIN DÉROULÉ -->
    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.1em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
