<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #0b0711;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow-x: hidden;
        }

        /* --- ÉCRAN GLOBAL --- */
        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, #1e1132 0%, #0b0711 75%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .welcome-title {
            color: #f3e5ab;
            font-size: 1.6em;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 50px;
            text-shadow: 0 0 15px rgba(184, 134, 11, 0.8);
            text-align: center;
        }

        /* --- CONTENEUR PRINCIPAL DU ROULEAU --- */
        .scroll-wrapper {
            position: relative;
            width: 480px;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            animation: float 3.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(0.5deg); }
        }

        /* Le cylindre horizontal en tissu/parchemin bleu nuit */
        .scroll-body {
            position: absolute;
            width: 420px;
            height: 120px;
            background: linear-gradient(180deg, #150b24 0%, #291b3d 30%, #3d2657 50%, #291b3d 70%, #150b24 100%);
            border-radius: 6px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 25px rgba(138, 43, 226, 0.3);
            z-index: 1;
        }

        /* Embouts en bois doré / cylindres latéraux */
        .scroll-cap-left, .scroll-cap-right {
            position: absolute;
            top: 10px;
            bottom: 10px;
            width: 32px;
            background: linear-gradient(90deg, #5c4314 0%, #d4af37 35%, #fff2a3 50%, #d4af37 65%, #42300d 100%);
            border-radius: 6px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            z-index: 2;
        }

        .scroll-cap-left {
            left: -12px;
        }

        .scroll-cap-right {
            right: -12px;
        }

        /* La corde tressée en diagonale autour du rouleau */
        .scroll-rope {
            position: absolute;
            width: 140px;
            height: 140px;
            background: repeating-linear-gradient(45deg, #a68b5b, #a68b5b 6px, #59462c 6px, #59462c 12px);
            border-radius: 50%;
            z-index: 3;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            clip-path: polygon(30% 0%, 70% 0%, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0% 70%, 0% 30%);
        }

        /* Le sceau / Logo central */
        .seal-logo {
            position: relative;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            border: 4px solid #ffd700;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8), 0 0 60px rgba(138, 43, 226, 0.9);
            object-fit: cover;
            z-index: 4;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .scroll-wrapper:hover .seal-logo {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 80px rgba(138, 43, 226, 1);
        }

        .seal-instruction {
            color: #b8a9d9;
            font-size: 0.9em;
            margin-top: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* --- CONTENU DU PARCHEMIN DÉROULÉ --- */
        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5;
            border: 3px solid #8c7355;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            padding: 35px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DU ROULEAU FERMÉ -->
    <div id="seal-screen">
        <div class="welcome-title">— Archives de Zenkai NRP —</div>
        
        <div class="scroll-wrapper" onclick="breakSeal()" title="Briser le sceau">
            <div class="scroll-cap-left"></div>
            <div class="scroll-body"></div>
            <div class="scroll-cap-right"></div>
            <div class="scroll-rope"></div>
            <!-- Assure-toi que ton image est nommée exactement logo.jpg sur GitHub -->
            <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
        </div>

        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <!-- CONTENU DU PARCHEMIN DÉROULÉ -->
    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.1em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
