<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        body {
            background-color: #06040a;
            background-image: 
                radial-gradient(circle at center, #1f1335 0%, #06040a 80%),
                linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8));
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s ease, transform 0.8s ease;
            background: transparent; 
        }

        .scroll-container {
            position: relative;
            cursor: pointer;
            animation: float 3.5s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 20px 40px rgba(110, 50, 180, 0.4));
            margin-bottom: 40px;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .keychain-img {
            /* L'image du nouveau parchemin avec le logo intégré */
            max-width: 950px; /* Ajuste la taille max selon tes besoins */
            width: 95vw;
            height: auto;
            display: block;
        }

        /* Le logo superposé est maintenant dans l'image, donc pas besoin d'un deuxième <img> ici */

        .seal-instruction {
            color: #d8b4fe;
            font-size: 0.9em;
            position: absolute;
            bottom: 40px;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            animation: pulse 1.5s infinite;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        #main-content {
            max-width: 850px;
            width: 90%;
            background: #e3d3b5;
            border: 3px solid #8c7355;
            box-shadow: 0 15px 45px rgba(0,0,0,0.8);
            padding: 35px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.2);
            pointer-events: none;
        }

        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #a68b5b;
            padding-bottom: 18px;
            margin-bottom: 22px;
        }

        .scroll-symbols {
            font-size: 2.8em;
            font-weight: bold;
            letter-spacing: 12px;
            color: #1a120b;
        }

        .scroll-subtitle {
            font-size: 0.8em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DU PARCHEMIN FERMÉ -->
    <div id="seal-screen">
        
        <div class="scroll-container" onclick="breakSeal()" title="Briser le sceau">
            <!-- Ton image finale, qui contient le rouleau ET le logo intégré -->
            <img src="image_8a4139.png" alt="Parchemin Shinobi avec Sceau Intégré" class="keychain-img">
            <!-- Plus besoin du deuxième <img> pour le logo -->
        </div>

        <div class="seal-instruction">[ Cliquez sur le parchemin pour briser la protection ]</div>
    </div>

    <!-- CONTENU DU PARCHEMIN DÉROULÉ -->
    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.1em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
