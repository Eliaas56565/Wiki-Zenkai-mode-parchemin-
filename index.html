<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenkai NRP — Archives Shinobi</title>
    <style>
        body {
            background: radial-gradient(circle at center, #1a0f2b 0%, #08040f 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }

        #seal-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Conteneur avec effet de lueur magique globale derrière le rouleau */
        .scroll-container {
            position: relative;
            cursor: pointer;
            display: inline-block;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 20px 40px rgba(138, 43, 226, 0.4));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .scroll-container:hover {
            transform: scale(1.03) translateY(-5px);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .keychain-img {
            max-width: 700px;
            width: 90vw;
            height: auto;
            display: block;
            /* Amélioration logicielle du rendu de l'image par le navigateur */
            image-rendering: -webkit-optimize-contrast;
        }

        /* Sceau central sublimé avec un contour lumineux éclatant et des reflets dorés */
        .seal-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 22%;
            height: auto;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ffdf73;
            box-shadow: 
                0 0 25px rgba(255, 215, 0, 0.9), 
                0 0 50px rgba(147, 51, 234, 0.8),
                inset 0 0 15px rgba(255, 255, 255, 0.5);
            transition: all 0.4s ease;
        }

        .scroll-container:hover .seal-logo {
            border-color: #fff;
            box-shadow: 
                0 0 35px rgba(255, 215, 0, 1), 
                0 0 75px rgba(168, 85, 247, 1),
                inset 0 0 25px rgba(255, 255, 255, 0.8);
            transform: translate(-50%, -50%) scale(1.06);
        }

        .seal-instruction {
            color: #d8b4fe;
            font-size: 0.9em;
            margin-top: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.6);
            animation: pulse-text 2s infinite;
        }

        @keyframes pulse-text {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        /* --- CONTENU DU PARCHEMIN DÉROULÉ --- */
        #main-content {
            max-width: 850px;
            width: 85%;
            background: linear-gradient(135deg, #f3e5ab 0%, #d4bc82 100%);
            border: 4px solid #6b4f2c;
            box-shadow: 0 20px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(107, 79, 44, 0.2);
            padding: 40px;
            color: #2a2015;
            opacity: 0;
            transform: scaleY(0);
            transform-origin: top;
            transition: all 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            display: none;
            margin: 40px auto;
            border-radius: 4px;
        }

        .unsealed #main-content {
            display: block;
            opacity: 1;
            transform: scaleY(1);
        }

        .unsealed #seal-screen {
            opacity: 0;
            transform: scale(1.15);
            pointer-events: none;
        }

        .scroll-header {
            text-align: center;
            border-bottom: 2px dashed #8c7355;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .scroll-symbols {
            font-size: 3em;
            font-weight: bold;
            letter-spacing: 15px;
            color: #1a120b;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .scroll-subtitle {
            font-size: 0.85em;
            color: #7a6345;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: bold;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- ÉCRAN DU ROULEAU FERMÉ -->
    <div id="seal-screen">
        <div class="scroll-container" onclick="breakSeal()" title="Briser le sceau">
            <img src="fond-rouleau.jpg" alt="Rouleau Shinobi" class="keychain-img">
            <img src="logo.jpg" alt="Sceau Zenkai" class="seal-logo">
        </div>

        <div class="seal-instruction">[ Cliquez sur le sceau pour briser la protection ]</div>
    </div>

    <!-- CONTENU DU PARCHEMIN DÉROULÉ -->
    <div id="main-content">
        <div class="scroll-header">
            <div class="scroll-symbols">天地</div>
            <div class="scroll-subtitle">— Encyclopédie Shinobi & Archives Officielles —</div>
        </div>
        <div style="text-align: center; line-height: 1.9;">
            <p style="font-size: 1.2em; color: #5a1111;"><strong>Sceau rompu avec succès.</strong></p>
            <p style="font-style: italic; color: #5a4223;">Bienvenue dans les dossiers classifiés de l'encyclopédie Zenkai NRP.</p>
        </div>
    </div>

    <script>
        function breakSeal() {
            document.body.classList.add('unsealed');
        }
    </script>

</body>
</html>
